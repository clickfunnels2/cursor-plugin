name: Sync skills

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sync-skills-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-skills.mjs --check

  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-skills.mjs
      - name: Commit and push to main
        run: |
          git add -- skills skills.lock.json
          if git diff --cached --quiet; then
            echo "Published skills already match main."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync skills from accounts.myclickfunnels.com"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
